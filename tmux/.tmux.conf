# ~/.tmux.conf — symlinked from $DOTFILESDIR/tmux/.tmux.conf by install.sh

# Prefix: tmux's default Ctrl-b (explicitly set here so it's documented,
# even though it's also what tmux would use if this line were removed).
set -g prefix C-b
bind C-b send-prefix

set -g mouse on
set -g default-terminal "tmux-256color"

# Intuitive splits, preserving the current pane's working directory
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config without restarting tmux
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Visible quick-action menu: prefix + m pops up an on-screen list with the
# key to press shown next to each action (this overrides tmux's default
# "mark pane" binding on prefix + m, which is rarely used).
bind-key m display-menu -T "#[align=centre] Quick Actions " \
  "Windows"    1 "choose-tree -Zw" \
  "Split pane" 2 "split-window -h -c '#{pane_current_path}'" \
  "k9s"        3 "new-window -n k9s 'k9s'" \
  "htop"       4 "new-window -n htop 'htop'"

# ---- Plugins (managed by TPM: https://github.com/tmux-plugins/tpm) ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'xamut/tmux-weather'

# Catppuccin theme
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Auto-save/restore sessions across reboots
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Battery icon tiers (Nerd Font glyphs), used by the battery pill below
set -g @batt_icon_charge_tier8 "󰁹"
set -g @batt_icon_charge_tier7 "󰂁"
set -g @batt_icon_charge_tier6 "󰁿"
set -g @batt_icon_charge_tier5 "󰁾"
set -g @batt_icon_charge_tier4 "󰁽"
set -g @batt_icon_charge_tier3 "󰁼"
set -g @batt_icon_charge_tier2 "󰁻"
set -g @batt_icon_charge_tier1 "󰁺"

# Weather: no API key needed — xamut/tmux-weather calls wttr.in, which
# geolocates by IP. Set @tmux-weather-location "City" below to pin one
# instead.
set -g @tmux-weather-format "%c+%t"
set -g @tmux-weather-units "m"

# Status bar: app (left, via catppuccin) ; cpu, memory, weather, k8s
# context+namespace, session, battery (right)
#
# CPU/memory/battery/weather pills below are hand-built (same visual style
# as catppuccin's own modules: #{@thm_*} palette colors + the theme's own
# separator glyphs) instead of using catppuccin's bundled cpu/battery
# modules or the tmux-cpu/tmux-battery/tmux-weather plugins'
# #{cpu_percentage}-style placeholder variables. Those placeholders only
# work via a one-shot find-and-replace each plugin runs against
# status-right's text at plugin-load time — and TPM loads all plugins in
# parallel, so whether catppuccin's module text (containing the
# placeholder) already exists *before* that find-and-replace runs is a
# race. Reproduced losing that race directly: status bar permanently
# stuck showing the literal text "#{cpu_percentage}" instead of a number.
# Calling each plugin's own backing script directly via #(...) sidesteps
# the race entirely — the same plain command-substitution mechanism the
# k8s-status.sh segment below already uses reliably.
set -g status-left-length 100
set -g status-right-length 150
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#[fg=#{@thm_yellow}]#{@catppuccin_status_left_separator}#[fg=#{@thm_crust},bg=#{@thm_yellow}]  #{@catppuccin_status_middle_separator}#[fg=#{@thm_fg},bg=#{@thm_surface_0}] #(~/.config/tmux/scripts/cpu-status.sh) #[fg=#{@thm_surface_0}]#{@catppuccin_status_right_separator}"
set -ag status-right "#[fg=#{@thm_mauve}]#{@catppuccin_status_left_separator}#[fg=#{@thm_crust},bg=#{@thm_mauve}] 󰍛 #{@catppuccin_status_middle_separator}#[fg=#{@thm_fg},bg=#{@thm_surface_0}] #(~/.tmux/plugins/tmux-cpu/scripts/ram_percentage.sh) #[fg=#{@thm_surface_0}]#{@catppuccin_status_right_separator}"
set -ag status-right "#[fg=#{@thm_teal}]#{@catppuccin_status_left_separator}#[fg=#{@thm_crust},bg=#{@thm_teal}]  #{@catppuccin_status_middle_separator}#[fg=#{@thm_fg},bg=#{@thm_surface_0}] #(~/.tmux/plugins/tmux-weather/scripts/weather.sh) #[fg=#{@thm_surface_0}]#{@catppuccin_status_right_separator}"
set -ag status-right "#(~/.config/tmux/scripts/k8s-status.sh)"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#[fg=#{@thm_lavender}]#{@catppuccin_status_left_separator}#[fg=#{@thm_crust},bg=#{@thm_lavender}] #(~/.tmux/plugins/tmux-battery/scripts/battery_icon.sh)  #{@catppuccin_status_middle_separator}#[fg=#{@thm_fg},bg=#{@thm_surface_0}] #(~/.tmux/plugins/tmux-battery/scripts/battery_percentage.sh) #[fg=#{@thm_surface_0}]#{@catppuccin_status_right_separator}"

# Initialize TPM (must be the last line in this file)
run '~/.tmux/plugins/tpm/tpm'

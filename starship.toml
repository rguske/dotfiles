"$schema" = 'https://starship.rs/config-schema.json'

# starship.toml — Powerline-style prompt (Powerlevel10k-esque), built on top
# of Starship's official `catppuccin-powerline` preset, in Catppuccin Mocha.
# Two-line layout: segment pills on line 1, bare prompt char on line 2.
# Carries forward the always-on Kubernetes context/namespace capsule that
# turns solid red for prod-like contexts.

format = """
[](red)\
$os\
$username\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_status\
[](fg:yellow bg:sapphire)\
$kubernetes\
[](fg:sapphire bg:lavender)\
$time\
[ ](fg:lavender)\
$cmd_duration\
$line_break\
$character"""

palette = "catppuccin_mocha"

[os]
disabled = false
style = "bg:red fg:crust"

[os.symbols]
Macos = "󰀵 "

[username]
show_always = false
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user ]($style)'

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)[$read_only]($read_only_style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
read_only = " 🔒"
read_only_style = "bg:peach fg:crust"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'

[kubernetes]
disabled = false
# The capsule is painted entirely by $style (not a hardcoded palette color)
# so the per-context override below can flip the WHOLE background to red,
# not just the text. \( and \) render literal parentheses around
# $namespace — bare (...) in a Starship format string is a conditional-group
# construct, not literal text, and would otherwise silently swallow the
# parens themselves.
symbol = "⎈ "
format = '[ $symbol$context\($namespace\) ]($style)'
style = "bg:sapphire fg:crust"

[[kubernetes.contexts]]
# Only the FIRST matching entry in this list applies (no merging across
# entries) — so the prod red-flag rule MUST come before the alias rule
# below, or a prod context that also happens to match the ocp alias
# pattern would silently lose its red highlight in favor of the shorter
# alias. Case-insensitive "contains prod" match; NOTE: (?i) is unsupported
# by this starship build's regex engine (it silently fails to compile and
# the rule gets dropped) — do not "simplify" this back to (?i).*prod.*.
context_pattern = ".*[Pp][Rr][Oo][Dd].*"
style = "bg:red fg:crust"

[[kubernetes.contexts]]
# OpenShift `oc login` context names are "<ns>/<api-host>/<user>" and get
# unreadably long. Shorten any non-prod "api-ocp-<id>-..." context down to
# "ocp-<id>"; contexts that don't match this pattern pass through
# unchanged (e.g. kind/docker-desktop/minikube). (Using `contexts` +
# `context_alias` here, not the top-level `context_aliases` table — that's
# deprecated since Starship 1.21 and prints a warning on every prompt.)
context_pattern = '.*api-ocp-(?P<cluster>[a-zA-Z0-9]+)-.*'
context_alias = "ocp-$cluster"

[time]
disabled = false
time_format = "%R"
style = "bg:lavender"
format = '[[  $time ](fg:crust bg:lavender)]($style)'

[cmd_duration]
show_milliseconds = true
format = "[ took $duration ]($style)"
style = "fg:lavender"
disabled = false
min_time = 2000

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold green)'
vimcmd_replace_one_symbol = '[❮](bold lavender)'
vimcmd_replace_symbol = '[❮](bold lavender)'
vimcmd_visual_symbol = '[❮](bold yellow)'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"


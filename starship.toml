# starship.toml — prompt: path, git, and an always-on Kubernetes
# context/namespace indicator that turns bold red for prod-like contexts.

format = """
$directory\
$git_branch\
$git_status\
$kubernetes\
$line_break\
$character"""

palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[directory]
style = "bold lavender"
truncation_length = 3
truncate_to_repo = true
read_only = " 🔒"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
style = "bold mauve"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold peach"
format = "([$all_status$ahead_behind]($style) )"

[kubernetes]
disabled = false
# \( and \) render literal parentheses around $namespace. Bare (...) in a
# Starship format string is a conditional-group construct, not literal
# text, and would otherwise silently swallow the parens themselves.
format = '[⎈ $context\($namespace\)]($style) '
style = "bold blue"

[[kubernetes.contexts]]
# Case-insensitive "contains prod" match. NOTE: (?i) is unsupported by this
# starship build's regex engine (it silently fails to compile and the rule
# gets dropped) — do not "simplify" this back to (?i).*prod.*.
context_pattern = ".*[Pp][Rr][Oo][Dd].*"
style = "bold red"

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
